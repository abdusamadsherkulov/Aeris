<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aeris — Weather</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="clear-day">
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="app">
    <header class="top">
      <div class="brand">Aeris<span>.</span></div>

      <form id="searchForm" class="search" autocomplete="off">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cityInput" type="text" placeholder="Search a city…" aria-label="City" />
        <button type="submit">Go</button>
        <ul id="suggest" class="suggest" role="listbox"></ul>
      </form>

      <div class="actions">
        <button id="surprise" class="pill" title="Random city">🎲 Surprise me</button>
        <div class="seg" role="group" aria-label="Units">
          <button data-u="metric">°C</button>
          <button data-u="imperial">°F</button>
        </div>
      </div>
    </header>

    <div id="recent" class="recent"></div>

    <section id="view" class="view loading">
      <div class="hero glass">
        <div class="loc">
          <h1 id="city">—</h1>
          <span id="country" class="badge"></span>
        </div>
        <p id="clock" class="muted"></p>

        <div class="temp-row">
          <img id="icon" alt="" />
          <div id="temp" class="temp">--</div>
          <div class="unit" id="unitLbl">°</div>
        </div>

        <p id="desc" class="desc"></p>
        <div class="chips">
          <span class="chip">↑ <b id="hi">--</b></span>
          <span class="chip">↓ <b id="lo">--</b></span>
          <span class="chip">Feels like <b id="feels">--</b></span>
        </div>
        <p id="vibe" class="vibe"></p>
      </div>

      <div class="tiles">
        <div class="tile glass">
          <h3>Humidity</h3>
          <svg viewBox="0 0 100 100" class="ring">
            <circle cx="50" cy="50" r="40" class="ring-bg"/>
            <circle id="humRing" cx="50" cy="50" r="40" class="ring-fg"/>
            <text id="humTxt" x="50" y="56" text-anchor="middle">--</text>
          </svg>
        </div>

        <div class="tile glass">
          <h3>Wind</h3>
          <svg viewBox="0 0 100 100" class="compass">
            <circle cx="50" cy="50" r="40" class="ring-bg"/>
            <text x="50" y="17" text-anchor="middle" class="cd">N</text>
            <text x="86" y="54" text-anchor="middle" class="cd">E</text>
            <text x="50" y="94" text-anchor="middle" class="cd">S</text>
            <text x="14" y="54" text-anchor="middle" class="cd">W</text>
            <g id="arrow"><path d="M50 26 L58 52 L50 47 L42 52 Z" fill="#fff"/></g>
          </svg>
          <p class="big" id="wind">--</p>
        </div>

        <div class="tile glass">
          <h3>Pressure</h3>
          <p class="big" id="press">--</p>
          <div class="bar"><i id="pressBar"></i></div>
          <p class="muted small" id="pressLbl"></p>
        </div>

        <div class="tile glass">
          <h3>Visibility</h3>
          <p class="big" id="vis">--</p>
          <p class="muted small" id="cloudLbl"></p>
        </div>

        <div class="tile glass wide">
          <h3>Sun</h3>
          <svg viewBox="0 0 200 110" class="sun">
            <path d="M10 95 A90 90 0 0 1 190 95" class="arc"/>
            <line x1="0" y1="95" x2="200" y2="95" class="horizon"/>
            <circle id="sunDot" r="7" cx="10" cy="95"/>
          </svg>
          <div class="sun-times"><span>🌅 <b id="rise">--</b></span><span><b id="set">--</b> 🌇</span></div>
        </div>
      </div>

      <div class="forecast glass" id="forecast"></div>
    </section>

    <footer>Data by OpenWeatherMap · Powered by your Python weather module</footer>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
